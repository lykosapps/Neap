name: Support my headset
description: Help Neap work with another Turtle Beach headset that works with Swarm II.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: >-
        Thanks for helping. Neap works only with headsets that work with
        Turtle Beach's Swarm II app, because it talks to the headset the way
        Swarm II does. If yours doesn't work with Swarm II, Neap can't
        support it. If you haven't made a recording yet, the
        [guide](https://github.com/lykosapps/Neap/blob/main/docs/MAPPING.md)
        shows how. It takes about ten minutes.
  - type: checkboxes
    id: swarm
    attributes:
      label: Swarm II
      options:
        - label: My headset works with Swarm II.
          required: true
  - type: input
    id: headset
    attributes:
      label: Your headset
      description: Its name as it appears on the box, for example Stealth 700 Gen 3.
    validations:
      required: true
  - type: textarea
    id: recording
    attributes:
      label: Recording
      description: Drag your recording from Neap here.
    validations:
      required: true
  - type: textarea
    id: found
    attributes:
      label: What Neap found
      description: Filled in by Neap from your recording.
  - type: textarea
    id: skipped
    attributes:
      label: Anything you skipped?
      description: Steps from the guide's list your headset doesn't have, or that didn't seem to do anything.
  - type: input
    id: hardware
    attributes:
      label: Headset hardware plugged in
  - type: input
    id: version
    attributes:
      label: Neap version
  - type: input
    id: windows
    attributes:
      label: Operating system
