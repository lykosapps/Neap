name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Avalonia's build tools report each build to Avalonia unless told not to.
  AVALONIA_TELEMETRY_OPTOUT: 1

jobs:
  build:
    # WinUI and the Windows audio and HID APIs only build on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Neap.sln

      - name: Build
        run: dotnet build Neap.sln -c Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Check formatting
        run: dotnet format Neap.sln --verify-no-changes --no-restore

      - name: Test
        run: dotnet test --project tests/Neap.Core.Tests -c Release --no-build

  linux:
    # The app for Linux, built and tested on Linux: what only Linux compiles
    # (the headset, the sound server, the key grabs) and the tests that only
    # run there, such as the headset permission rule written by a real shell.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore src/Neap.Desktop && dotnet restore tests/Neap.Core.Tests

      - name: Build
        run: dotnet build src/Neap.Desktop -c Release -f net10.0 --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet test --project tests/Neap.Core.Tests -c Release
