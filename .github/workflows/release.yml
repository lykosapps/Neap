name: Release

# Push a tag such as v0.1.0 to build the app on GitHub and attach it to a
# release, so every download can be traced to a commit and rebuilt by anyone.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test --project tests/Neap.Core.Tests -c Release

      - name: Publish
        run: |
          $version = $env:TAG.TrimStart('v')
          dotnet publish src/Neap.App -c Release -r win-x64 -o publish `
            -p:Version=$version -p:ContinuousIntegrationBuild=true

      - name: Package
        run: |
          $version = $env:TAG.TrimStart('v')
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.txt publish/

          # The Windows App SDK's own terms travel with its runtime.
          [xml]$project = Get-Content src/Neap.App/Neap.App.csproj
          $sdk = $project.Project.ItemGroup.PackageReference |
            Where-Object Include -eq 'Microsoft.WindowsAppSDK' | Select-Object -ExpandProperty Version
          $packages = (dotnet nuget locals global-packages --list) -replace '^global-packages:\s*', ''
          $source = Join-Path $packages "microsoft.windowsappsdk/$sdk"
          Copy-Item (Join-Path $source license.txt) publish/WindowsAppSDK-LICENSE.txt
          Copy-Item (Join-Path $source NOTICE.txt) publish/WindowsAppSDK-NOTICE.txt

          $zip = "Neap-$version-win-x64.zip"
          Compress-Archive -Path publish/* -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zip" | Out-File -Encoding ascii "$zip.sha256"
          "ZIP=$zip" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # The release page carries the version's changelog section, so it says
      # what Neap does in the same words as the repository.
      - name: Notes
        run: |
          $version = $env:TAG.TrimStart('v')
          $lines = Get-Content CHANGELOG.md
          $start = [array]::FindIndex($lines, [Predicate[string]]{ param($l) $l -match "^## $([regex]::Escape($version))\b" })
          if ($start -lt 0) { throw "CHANGELOG.md has no section for $version." }
          $end = [array]::FindIndex($lines, $start + 1, [Predicate[string]]{ param($l) $l -match '^## ' })
          if ($end -lt 0) { $end = $lines.Count }
          $install = @(
            "Unzip $env:ZIP into a folder you will keep and run Neap.exe. It is not signed, so Windows may say it protected your PC: choose More info, then Run anyway."
            ''
          )
          # Release pages keep every line break, so the changelog's wrapped
          # lines are joined back into one line per paragraph or list item.
          $notes = New-Object System.Collections.Generic.List[string]
          foreach ($line in $install + $lines[($start + 1)..($end - 1)]) {
            $previous = if ($notes.Count) { $notes[$notes.Count - 1] } else { '' }
            if ($line.Trim() -and $previous.Trim() -and $line -notmatch '^\s*(#|- |\d+\. )') {
              $notes[$notes.Count - 1] = "$previous $($line.Trim())"
            } else {
              $notes.Add($line)
            }
          }
          $notes | Out-File -Encoding utf8 notes.md

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:TAG $env:ZIP "$env:ZIP.sha256" --title "Neap $($env:TAG.TrimStart('v'))" --notes-file notes.md
